name: Quality gate
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
      - name: Configure disposable runner database (no OAuth secrets)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text().replace('[auth.external.google]\nenabled = true', '[auth.external.google]\nenabled = false')
          s = s.replace('[studio]\nenabled = true', '[studio]\nenabled = false')
          p.write_text(s)
          PY
      - name: Start local stack
        run: |
          mkdir -p .tools
          supabase start > .tools/ci-start.log 2>&1
      - run: supabase db reset --local
      - run: supabase db lint --local --level warning
      - run: scripts/test-db.sh
      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup
